<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>POS</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --card:#f3f3f6; --line:#d4d4dc; --acc:#1b5fd1; --ok:#127a3b; --bad:#b3261e; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --fg:#ececf0; --mut:#a0a0aa; --card:#212126; --line:#3a3a42; --acc:#6aa0ff; --ok:#58c47f; --bad:#ff8a80; --warn:#f0b955; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { max-width: 640px; margin: 0 auto; padding: .5rem .75rem 5rem; }
  button, input, select { font: inherit; color: inherit; }
  button { border:1px solid var(--line); background:var(--card); border-radius:.6rem; padding:.7rem .9rem; min-height:2.75rem; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); font-weight:600; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.45; }
  input, select { width:100%; border:1px solid var(--line); background:var(--bg); border-radius:.5rem; padding:.65rem; min-height:2.6rem; }
  h1 { font-size:1.2rem; margin:.4rem 0; } h2 { font-size:1.05rem; margin:.8rem 0 .3rem; }
  .banner { padding:.45rem .75rem; font-size:.9rem; text-align:center; font-weight:600; }
  .banner.test { background:#b3261e; color:#fff; } .banner.prod { background:var(--card); color:var(--mut); font-weight:400; }
  .banner.warn { background:var(--warn); color:#fff; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:.5rem; padding:.4rem 0; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; border-radius:0; background:none; } nav button.on { color:var(--acc); font-weight:700; }
  .chips { display:flex; gap:.4rem; overflow-x:auto; padding:.3rem 0; } .chips button { white-space:nowrap; } .chips button.on { background:var(--acc); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:.5rem; }
  .item { text-align:left; display:flex; flex-direction:column; gap:.15rem; } .item small { color:var(--mut); }
  .row { display:flex; justify-content:space-between; gap:.5rem; align-items:center; padding:.35rem 0; border-bottom:1px solid var(--line); }
  .row .qty { display:flex; align-items:center; gap:.4rem; } .row .qty button { min-height:2.2rem; padding:.2rem .7rem; }
  .total { font-size:1.35rem; font-weight:700; display:flex; justify-content:space-between; padding:.5rem 0; }
  .pay { display:grid; grid-template-columns:5rem 1fr auto; gap:.4rem; align-items:center; margin:.3rem 0; }
  .msg { padding:.6rem; border-radius:.5rem; margin:.5rem 0; background:var(--card); } .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); } .msg.warn { color:var(--warn); }
  pre.receipt { background:#fff; color:#000; padding:.6rem; border:1px solid var(--line); overflow-x:auto; font-size:.72rem; line-height:1.25; }
  .muted { color:var(--mut); } .tag { font-size:.75rem; padding:.1rem .4rem; border-radius:.3rem; background:var(--bad); color:#fff; }
  .hidden { display:none !important; } label { display:block; font-size:.85rem; color:var(--mut); margin:.5rem 0 .15rem; }
  nav button { padding:.7rem .15rem; font-size:.88rem; }
  .brow { display:block; width:100%; text-align:left; padding:.5rem .6rem; margin:.25rem 0; } .brow .btop { display:flex; justify-content:space-between; gap:.5rem; }
  .btrack { display:block; height:.7rem; background:var(--line); border-radius:.35rem; overflow:hidden; margin-top:.35rem; } .bfill { display:block; height:100%; background:var(--acc); }
  .trend { display:flex; align-items:stretch; gap:2px; height:9rem; margin-top:.5rem; } .tcol { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; } .tarea { flex:1; width:100%; display:flex; align-items:flex-end; }
  .tbar { width:100%; background:var(--acc); border-radius:.2rem .2rem 0 0; } .tlab { font-size:.62rem; color:var(--mut); margin-top:.15rem; white-space:nowrap; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; } td, th { padding:.3rem .2rem; border-bottom:1px solid var(--line); text-align:right; } td:first-child, th:first-child { text-align:left; }
</style>
</head>
<body>
<div id="banner" class="banner prod hidden"></div>
<div id="offline" class="banner warn hidden">No connection. Billing is paused until it returns.</div>
<main id="root"></main>
<nav id="nav" class="hidden">
  <button data-tab="bill">Bill</button><button data-tab="recent">Recent</button><button data-tab="menu" class="hidden">Menu</button><button data-tab="sales" class="hidden">Sales</button><button data-tab="admin" class="hidden">Day</button><button data-tab="settings">Settings</button>
</nav>
<script>
(function () {
"use strict";
var POS = window.POS = { version: "0.4.2" };
var cfg = null, session = null, staff = null, shop = null, categories = [], menu = [];
var state = { tab: "bill", cat: "all", cart: new Map(), busy: false, uncertain: null, taxLocked: false, receipt: null, recent: [], detail: null };
var root = document.getElementById("root");

/* ---------- small helpers: DOM is built with textContent only, never innerHTML ---------- */
function h(tag, attrs, kids) {
  var e = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    var v = attrs[k];
    if (k === "text") e.textContent = v; else if (k === "class") e.className = v;
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  });
  (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
function $(id) { return document.getElementById(id); }

/* ---------- money: integer paise everywhere, no floating point in any sum ---------- */
var money = POS.money = {
  fmt: function (p) { var neg = p < 0, a = Math.abs(p), r = Math.floor(a / 100), f = a % 100;
    return (neg ? "-" : "") + "\u20B9" + String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + (f < 10 ? "0" : "") + f; },
  plain: function (p) { var a = Math.abs(p), f = a % 100; return (p < 0 ? "-" : "") + String(Math.floor(a / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + (f < 10 ? "0" : "") + f; },
  parse: function (s) { s = String(s == null ? "" : s).trim(); if (s === "") return 0; var m = /^(\d{1,7})(?:\.(\d{1,2}))?$/.exec(s); if (!m) return null;
    return parseInt(m[1], 10) * 100 + (m[2] ? parseInt((m[2] + "0").slice(0, 2), 10) : 0); }
};
function istDate(d) { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata" }).format(d || new Date()); }
function istTime(iso) { return new Intl.DateTimeFormat("en-IN", { timeZone: "Asia/Kolkata", day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso)); }
function dayRange(date) { var start = new Date(date + "T00:00:00+05:30"); return [start.toISOString(), new Date(start.getTime() + 86400000).toISOString()]; }

/* ---------- configuration: nothing secret is embedded; only the project URL and the PUBLIC (publishable) key ---------- */
function decodeJwt(t) { try { return JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))); } catch (e) { return null; } }
POS.validateConfig = function (c) {
  if (!c || typeof c !== "object") return "config.json is missing or not valid JSON";
  if (c.env !== "test" && c.env !== "production") return 'config.env must be "test" or "production"';
  var okUrl = /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(c.supabaseUrl || "") || (c.env === "test" && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(c.supabaseUrl || ""));
  if (!okUrl) return "config.supabaseUrl must be https://<project>.supabase.co";
  if (!c.supabaseKey || typeof c.supabaseKey !== "string") return "config.supabaseKey (the publishable key) is missing";
  if (/^sb_secret_/.test(c.supabaseKey) || (decodeJwt(c.supabaseKey) || {}).role === "service_role")
    return "REFUSED: this is a secret / service-role key. Use the publishable key. Never put a secret key in a web page.";
  return null;
};
function projectRef() { return cfg.supabaseUrl.replace(/^https?:\/\//, "").split(".")[0].split(":")[0]; }

/* ---------- API layer: Supabase Auth + PostgREST over fetch ---------- */
function ApiError(status, code, message, network) { this.status = status; this.code = code; this.message = message; this.network = !!network; }
ApiError.prototype = Object.create(Error.prototype);
function timeoutFetch(url, opts, ms) {
  var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, ms || 20000);
  opts = Object.assign({}, opts, { signal: ctl.signal });
  return fetch(url, opts).then(function (r) { clearTimeout(t); return r; }, function (e) { clearTimeout(t); throw new ApiError(0, "network", "No answer from the server (" + (e && e.name === "AbortError" ? "timed out" : "offline") + ")", true); });
}
function readJson(res) { return res.text().then(function (t) { if (!t) return null; try { return JSON.parse(t); } catch (e) { return t; } }); }
var SKEY = function () { return "pos.session." + cfg.env; };
function saveSession(s) { session = s; if (s) localStorage.setItem(SKEY(), JSON.stringify(s)); else localStorage.removeItem(SKEY()); }
function authCall(path, body, token) {
  var headers = { apikey: cfg.supabaseKey, "Content-Type": "application/json" }; if (token) headers.Authorization = "Bearer " + token;
  return timeoutFetch(cfg.supabaseUrl + "/auth/v1/" + path, { method: "POST", headers: headers, body: JSON.stringify(body || {}) });
}
function toSession(d) { return { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (d.expires_in || 3600), user_id: d.user && d.user.id, email: d.user && d.user.email }; }
/* Says WHY a sign-in was refused, using only the status and the error code Supabase returned. Never echoes the email, password or key. */
POS.loginMessage = function (e) {
  if (e && e.network) return errText(e);
  var st = e && e.status, code = e && e.code, msg = (e && e.message) || "";
  if (code === "email_not_confirmed" || /not confirmed/i.test(msg)) return "Sign-in failed: this email has not been confirmed in Supabase. An admin must confirm it.";
  if (code === "invalid_credentials" || /invalid login credentials/i.test(msg)) return "Sign-in failed: wrong email or password.";
  if (st === 401 || st === 403 || /api key/i.test(msg)) return "Sign-in failed: the app's key was rejected (HTTP " + st + "). Check supabaseKey in config.json.";
  if (st === 429 || /rate limit/i.test(code || "") || /rate limit/i.test(msg)) return "Sign-in failed: too many attempts. Wait a few minutes and try again.";
  if (code === "user_banned") return "Sign-in failed: this account is blocked.";
  return "Sign-in failed (HTTP " + st + (code ? ", " + code : "") + ").";
};
POS.signIn = function (email, password) {
  return authCall("token?grant_type=password", { email: email, password: password }).then(function (res) { return readJson(res).then(function (d) {
    if (!res.ok) throw new ApiError(res.status, (d && (d.error_code || d.error)) || "auth", (d && (d.msg || d.error_description || d.message)) || "Sign-in failed");
    saveSession(toSession(d)); }); });
};
var refreshing = null;
function refreshToken() {
  if (!session || !session.refresh_token) return Promise.reject(new ApiError(401, "no_session", "Please sign in again"));
  if (!refreshing) refreshing = authCall("token?grant_type=refresh_token", { refresh_token: session.refresh_token }).then(function (res) { return readJson(res).then(function (d) {
    refreshing = null; if (!res.ok) { saveSession(null); staff = null; loginView(); var le = $("login-error"); if (le) { le.textContent = "Your session has ended. Please sign in again."; le.classList.remove("hidden"); } throw new ApiError(401, "refresh_failed", "Your session has ended. Please sign in again."); } saveSession(toSession(d)); }); }, function (e) { refreshing = null; throw e; });
  return refreshing;
}
function ensureToken() { if (session && session.expires_at - Math.floor(Date.now() / 1000) < 60) return refreshToken(); return Promise.resolve(); }
var api = POS.api = function (method, path, body, retried, extra) {
  return ensureToken().then(function () {
    var headers = { apikey: cfg.supabaseKey, Authorization: "Bearer " + (session && session.access_token), "Content-Type": "application/json", Accept: "application/json" }; if (extra) Object.keys(extra).forEach(function (k) { headers[k] = extra[k]; });
    return timeoutFetch(cfg.supabaseUrl + "/rest/v1" + path, { method: method, headers: headers, body: body === undefined ? undefined : JSON.stringify(body), cache: "no-store" });
  }).then(function (res) {
    if (res.status === 401 && !retried) return refreshToken().then(function () { return api(method, path, body, true, extra); });
    return readJson(res).then(function (d) {
      if (!res.ok) throw new ApiError(res.status, d && d.code, (d && d.message) || ("Request failed (" + res.status + ")"));
      return d; });
  });
};

/* ---------- receipt text and ESC/POS bytes ---------- */
function ascii(s) { return String(s == null ? "" : s).replace(/\u20B9/g, "Rs ").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^\x20-\x7e]/g, "?"); }
function wrap(text, w) { var out = [], words = ascii(text).split(" "), line = ""; words.forEach(function (x) { while (x.length > w) { if (line) { out.push(line); line = ""; } out.push(x.slice(0, w)); x = x.slice(w); }
  if ((line + " " + x).trim().length > w) { out.push(line); line = x; } else line = (line + " " + x).trim(); }); if (line) out.push(line); return out; }
function lr(l, r, w) { l = ascii(l); r = ascii(r); var gap = Math.max(1, w - l.length - r.length); return l + " ".repeat(gap) + r; }
function pad(s, w, right) { s = String(s); return right ? " ".repeat(Math.max(0, w - s.length)) + s : s + " ".repeat(Math.max(0, w - s.length)); }
POS.receiptLines = function (r, shopCfg, cols, duplicate) {
  var L = [], C = cols || 48, rule = "-".repeat(C);
  var add = function (t, o) { L.push(Object.assign({ t: t }, o || {})); };
  add(ascii(shopCfg.shop_name || "Shop"), { center: true, bold: true, big: true });
  [shopCfg.address, shopCfg.phone ? "Ph: " + shopCfg.phone : null, shopCfg.tax_enabled && shopCfg.gstin ? "GSTIN: " + shopCfg.gstin : null].forEach(function (x) { if (x) wrap(x, C).forEach(function (l) { add(l, { center: true }); }); });
  add(rule); add(lr("Bill No: " + r.bill_no, istTime(r.created_at), C));
  add("Cashier: " + ascii(r.cashier)); if (r.customer_name) add("Customer: " + ascii(r.customer_name));
  if (r.status === "voided") add("** VOIDED **", { center: true, bold: true });
  if (duplicate) add("*** DUPLICATE COPY ***", { center: true, bold: true });
  add(rule);
  var nw = C - 4 - 9 - 11; add(pad("Item", nw) + pad("Qty", 4, true) + pad("Rate", 9, true) + pad("Amount", 11, true));
  (r.items || []).forEach(function (i) { var parts = wrap(i.name, nw);
    add(pad(parts[0], nw) + pad(i.qty, 4, true) + pad(money.plain(i.unit_price_paise), 9, true) + pad(money.plain(i.unit_price_paise * i.qty), 11, true));
    parts.slice(1).forEach(function (p) { add(p); }); });
  add(rule);
  if (r.tax_paise > 0 && !r.tax_inclusive) { add(lr("Subtotal", money.plain(r.subtotal_paise), C)); add(lr("GST", money.plain(r.tax_paise), C)); }
  add(lr("TOTAL", "Rs " + money.plain(r.total_paise), C), { bold: true, tall: true });
  if (r.tax_paise > 0 && r.tax_inclusive) add(lr("Incl. GST", money.plain(r.tax_paise), C));
  (r.payments || []).forEach(function (p) { add(lr(p.mode, money.plain(p.amount_paise), C)); });
  add(rule);
  if (shopCfg.footer_note) wrap(shopCfg.footer_note, C).forEach(function (l) { add(l, { center: true }); });
  else add("Thank you!", { center: true });          /* the default line only when the shop has not set its own footer */
  return L;
};
POS.escpos = function (lines, cols) {
  var b = [0x1B, 0x40], C = cols || 48;
  var push = function (a) { for (var i = 0; i < a.length; i++) b.push(a[i]); };
  var enc = function (s) { var o = []; for (var i = 0; i < s.length; i++) o.push(s.charCodeAt(i) & 0x7f); return o; };
  lines.forEach(function (l) {
    push([0x1B, 0x61, l.center ? 1 : 0]); push([0x1B, 0x45, l.bold ? 1 : 0]); push([0x1D, 0x21, l.big ? 0x11 : (l.tall ? 0x01 : 0x00)]);
    var t = l.t; if (l.big && t.length > Math.floor(C / 2)) t = t.slice(0, Math.floor(C / 2));
    push(enc(t)); b.push(0x0A);
  });
  push([0x1B, 0x61, 0]); push([0x1B, 0x45, 0]); push([0x1D, 0x21, 0]); push([0x1B, 0x64, 4]); push([0x1D, 0x56, 0x42, 0x00]);
  return b;
};
POS.receiptText = function (lines, cols) { return lines.map(function (l) { var t = l.t; if (l.center) { var pad = Math.max(0, Math.floor(((cols || 48) - t.length) / 2)); t = " ".repeat(pad) + t; } return t; }).join("\n"); };

/* ---------- printing: WebUSB (preferred), RawBT app link, browser print dialog. A failed print never undoes a saved bill ---------- */
var CHUNK = 1024;
POS.nav = function (url) { window.location.href = url; };
POS.print = {
  usbSupported: function () { return typeof navigator !== "undefined" && "usb" in navigator; },
  usb: function (bytes, interactive) {
    if (!POS.print.usbSupported()) return Promise.reject(new Error("WebUSB is not available in this browser. Use Chrome on Android."));
    var vendor = (cfg.printer && cfg.printer.vendorId) || 0x0483, dev;
    return navigator.usb.getDevices().then(function (list) {
      dev = list.filter(function (d) { return d.vendorId === vendor; })[0];
      if (dev) return dev;
      if (!interactive) throw new Error("No printer is paired with this page yet. Tap Print to choose it.");
      return navigator.usb.requestDevice({ filters: [{ vendorId: vendor }] });
    }).then(function (d) { dev = d; return dev.open(); }).then(function () { return dev.configuration === null ? dev.selectConfiguration(1) : null; }).then(function () {
      var f = null; dev.configuration.interfaces.forEach(function (i) { i.alternates.forEach(function (a) { a.endpoints.forEach(function (e) { if (!f && e.direction === "out" && e.type === "bulk") f = { i: i.interfaceNumber, alt: a.alternateSetting, ep: e.endpointNumber }; }); }); });
      if (!f) throw new Error("The device has no printable endpoint.");
      return dev.claimInterface(f.i).then(function () { return f.alt ? dev.selectAlternateInterface(f.i, f.alt) : null; }).then(function () {
        var data = new Uint8Array(bytes), sent = 0;
        var step = function () { if (sent >= data.length) return Promise.resolve();
          return dev.transferOut(f.ep, data.slice(sent, sent + CHUNK)).then(function (r) { if (r.status !== "ok") throw new Error("The printer refused the data (" + r.status + ")."); sent += r.bytesWritten; return step(); }); };
        return step().then(function () { return dev.releaseInterface(f.i); }).then(function () { return dev.close(); }, function (e) { return Promise.resolve().then(function () { return dev.close(); }).catch(function () {}).then(function () { throw e; }); });
      });
    });
  },
  rawbtLink: function (bytes) { var s = ""; bytes.forEach(function (x) { s += String.fromCharCode(x); }); return "intent:base64," + btoa(s) + "#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;"; },
  rawbt: function (bytes) { var link = POS.print.rawbtLink(bytes); POS.nav(link); return link; },
  browser: function (text) {
    var f = document.createElement("iframe"); f.setAttribute("style", "position:fixed;width:0;height:0;border:0"); document.body.appendChild(f);
    var d = f.contentWindow.document; d.open(); d.write("<!doctype html><title>Receipt</title><pre style='font:12px/1.2 monospace;margin:0'></pre>"); d.close();
    d.querySelector("pre").textContent = text; f.contentWindow.focus(); f.contentWindow.print(); setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 3000);
  }
};
function cols() { return shop && shop.receipt_width === "58" ? 32 : ((cfg.printer && cfg.printer.columns) || 48); }
function printerMode() { return localStorage.getItem("pos.printer.mode") || (cfg.printer && cfg.printer.mode) || "auto"; }
function prep(receipt, duplicate) { var lines = POS.receiptLines(receipt, shop, cols(), duplicate); return { lines: lines, bytes: POS.escpos(lines, cols()), text: POS.receiptText(lines, cols()) }; }
POS.printReceipt = function (receipt, opts) {
  opts = opts || {}; var p = prep(receipt, !!opts.duplicate), mode = opts.mode || printerMode();
  if (mode === "rawbt") { POS.print.rawbt(p.bytes); return Promise.resolve("Sent to the RawBT app. Check the printer."); }
  if (mode === "browser") { POS.print.browser(p.text); return Promise.resolve("Opened the browser print dialog."); }
  return POS.print.usb(p.bytes, !!opts.interactive).then(function () { return "Sent to the printer. If nothing came out, check paper and cable."; });
};

/* ---------- the "may not have been saved" flag survives a reload and a sign-out until someone clears it in Recent ---------- */
function uKey() { return "pos.uncertain." + cfg.env; }
function setUncertain(info) { state.uncertain = info; try { localStorage.setItem(uKey(), JSON.stringify(info)); } catch (e) {} }
function clearUncertain() { state.uncertain = null; try { localStorage.removeItem(uKey()); } catch (e) {} }
function uText() { var u = state.uncertain || {}; return "The last bill" + (u.total ? " (" + money.fmt(u.total) + (u.at ? " at " + istTime(new Date(u.at).toISOString()).split(", ").pop() : "") + ")" : "") + " may or may not have been saved (no answer from the server)."; }

/* ---------- status line ---------- */
function status(text, kind) { var s = $("status"); if (!s) return; s.className = "msg " + (kind || ""); s.textContent = text || ""; s.classList.toggle("hidden", !text); }
function errText(e) { return e && e.message ? e.message : String(e); }

/* ---------- views ---------- */
function setBanner() {
  var b = $("banner"); b.classList.remove("hidden", "test", "prod");
  if (cfg.env === "test") { b.classList.add("test"); b.textContent = "TEST ENVIRONMENT (" + projectRef() + "): no real sales"; } else { b.classList.add("prod"); b.textContent = projectRef(); }
}
function fatal(msg) { clear(root); root.appendChild(h("div", { class: "msg bad", id: "fatal", text: msg })); $("nav").classList.add("hidden"); }
